<script>
/* Set the theme before the first paint so a dark-mode user never sees a light flash (the full logic lives in src/ui/appearance.js). */
try{var a=JSON.parse(localStorage.getItem('tavon-appearance')||'{}'),t=a.theme||'auto';if(t==='auto')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';if(t==='dark'||t==='light')document.documentElement.dataset.theme=t;}catch(e){}
</script>
<style>
#splash{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:var(--bg,#F6EFE6);transition:opacity .45s ease}
#splash.done{opacity:0;pointer-events:none}
#splash img{width:min(46vw,220px);height:auto;animation:splashin .8s ease both}
#splash .logo-paper{display:none}
html[data-theme="dark"] #splash .logo-ink{display:none}
html[data-theme="dark"] #splash .logo-paper{display:block}
@keyframes splashin{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#splash,#splash img{transition:none;animation:none}}
html[data-motion="off"] #splash,html[data-motion="off"] #splash img{transition:none;animation:none}
</style>
<link rel="stylesheet" href="src/styles/tokens.css">
<link rel="stylesheet" href="src/styles/base.css">
<link rel="stylesheet" href="src/styles/components.css">
</head>
<body>
<div id="splash" aria-hidden="true"><img class="logo-ink" src="assets/brand/tavon-logo-ink.svg" alt=""><img class="logo-paper" src="assets/brand/tavon-logo-paper.svg" alt=""></div>
<main class="page" id="app"></main>
<script>setTimeout(function(){var s=document.getElementById('splash');if(s)s.remove()},8000); /* safety: never trap the screen if something fails to load */</script>
<noscript><p style="padding:1rem">TAVON needs JavaScript.</p></noscript>
<script type="module" src="src/app/main.js"></script>
